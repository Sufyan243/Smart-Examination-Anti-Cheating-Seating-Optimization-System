# Server Configuration
server.port=8080
spring.application.name=Smart Examination Anti-Cheating System

# File Upload Configuration (for CSV)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Static Resources (for frontend)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging Configuration
logging.level.com.examseating.anticheating=DEBUG
logging.level.org.springframework.web=INFO

# CORS Configuration (if frontend is separate)
# Will be handled in WebConfig if needed

# Application Metadata
app.name=Smart Examination Anti-Cheating System
app.version=1.0.0
app.description=Algorithm Visualization + Decision System for Exam Seating Optimization

# CSV Configuration
csv.max-rows=1000
csv.allowed-extensions=csv
csv.header-format=RollNo,Name,Subject

# PDF Configuration
pdf.page-size=A4
pdf.orientation=landscape
pdf.font-size-title=20
pdf.font-size-content=8